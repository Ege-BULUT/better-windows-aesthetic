name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Inno Setup 6 is preinstalled on GitHub's Windows runners
      - name: Compile
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BetterWindowsAesthetic-Setup
          path: Output/BetterWindowsAesthetic-Setup.exe
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Output/BetterWindowsAesthetic-Setup.exe --title "${{ github.ref_name }}" --generate-notes
